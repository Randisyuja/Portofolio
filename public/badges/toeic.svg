<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Box Badge -->
  <rect x="8" y="14" width="84" height="72" rx="14" fill="#002D62" />
  
  <!-- Subtle inner border -->
  <rect x="11" y="17" width="78" height="66" rx="11" stroke="#FDB913" stroke-width="1.5" />
  
  <!-- ETS Wordmark -->
  <text x="50" y="36" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="3">ETS</text>
  
  <!-- Divider Line -->
  <line x1="28" y1="41" x2="72" y2="41" stroke="#FDB913" stroke-width="1" />
  
  <!-- TOEIC Big Text -->
  <text x="50" y="60" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#FDB913" letter-spacing="1">TOEIC</text>
  
  <!-- Subtext -->
  <text x="50" y="73" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="6" fill="#E2E8F0" letter-spacing="0.5">SCORE 735</text>
</svg>
